        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

        .modal-card {

<body>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, getDocs, getDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMvdKLVmlEQVITyd49jp0gB_jF3rIjaZY",
        authDomain: "dompet-b4b18.firebaseapp.com",
        projectId: "dompet-b4b18",
        storageBucket: "dompet-b4b18.firebasestorage.app",
        messagingSenderId: "147680807243",
        appId: "1:147680807243:web:8ebab5a7adf1ff82e100ce"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ACCOUNTS_COLLECTION = "accounts";

    let currentAccount = null;
    let availablePayers = [];
    let currentEditTransactionId = null;
    let pendingTransactionType = 'income';

    // DOM elements (singkat)
    const accountsView = document.getElementById('accountsView');
    const dashboardView = document.getElementById('dashboardView');
    const accountsListEl = document.getElementById('accountsList');
    const modal = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalInputName = document.getElementById('modalInputName');
    const modalInputPassword = document.getElementById('modalInputPassword');
    const modalError = document.getElementById('modalError');
    const btnTambahRekening = document.getElementById('btnTambahRekening');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');
    const logoutButton = document.getElementById('logoutButton');
    const editAccountBtn = document.getElementById('editAccountBtn');
    const deleteAccountBtn = document.getElementById('deleteAccountBtn');
    const dashboardNama = document.getElementById('dashboardNamaRekening');
    const dashboardSaldo = document.getElementById('dashboardSaldo');
    const transactionsListEl = document.getElementById('transactionsList');
    const filterStart = document.getElementById('filterStartDate');
    const filterEnd = document.getElementById('filterEndDate');
    const sortField = document.getElementById('sortField');
    const sortOrder = document.getElementById('sortOrder');
    const resetFilterBtn = document.getElementById('resetFilterBtn');
    const fixedButtonsDiv = document.getElementById('fixedButtons');
    const btnIncomeFloating = document.getElementById('btnIncomeFloating');
    const btnExpenseFloating = document.getElementById('btnExpenseFloating');
    const transaksiModal = document.getElementById('transaksiModal');
    const transaksiModalTitle = document.getElementById('transaksiModalTitle');

    const txPayer = document.getElementById('txPayer');

    const txDate = document.getElementById('txDate');
    const txModalCancel = document.getElementById('txModalCancel');
    const txModalSave = document.getElementById('txModalSave');
    const editTransModal = document.getElementById('editTransModal');
    const editRawText = document.getElementById('editRawText');
    const editPayer = document.getElementById('editPayer');
    const editPayerList = document.getElementById('editPayerList');
    const btnEditAddNewPayer = document.getElementById('btnEditAddNewPayer');
    const editDate = document.getElementById('editDate');
    const editTransCancel = document.getElementById('editTransCancel');
    const editTransSave = document.getElementById('editTransSave');
    const payerManagerModal = document.getElementById('payerManagerModal');
    const payerListContainer = document.getElementById('payerListContainer');
    const newPayerName = document.getElementById('newPayerName');
    const addNewPayerBtn = document.getElementById('addNewPayerBtn');
    const closePayerManager = document.getElementById('closePayerManager');
    const managePayerBtn = document.getElementById('managePayerBtn');
    const detailModal = document.getElementById('detailModal');
    const detailTitle = document.getElementById('detailTitle');
    const detailContent = document.getElementById('detailContent');
    const closeDetailBtn = document.getElementById('closeDetailBtn');

    function showToast(msg) { const toast = document.getElementById('toastMsg'); toast.textContent = msg; toast.style.opacity = '1'; setTimeout(() => toast.style.opacity = '0', 2000); }
    function formatRupiah(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); }
    function formatDate(iso) { if(!iso) return "-"; const d = new Date(iso); return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // ========== FUNGSI PARSING NOMINAL YANG BENAR ==========
    // Mengkonversi string nominal (misal "5000", "5rb", "7.000", "5ribu") menjadi angka
    function parseNominalString(nominalStr) {
        let clean = nominalStr.toLowerCase().trim();
        // Cek suffix
        let multiplier = 1;
        if (clean.endsWith('rb') || clean.endsWith('ribu')) {
            multiplier = 1000;
            clean = clean.replace(/(rb|ribu)$/, '');
        } else if (clean.endsWith('k')) {
            multiplier = 1000;
            clean = clean.replace(/k$/, '');
        }
        // Hapus titik dan koma pemisah ribuan
        clean = clean.replace(/\./g, '').replace(/,/g, '');
        let num = parseFloat(clean);
        if (isNaN(num)) return null;
        return num * multiplier;
    }

    // Ekstrak nominal dari sebuah baris: ambil kata terakhir, jika itu adalah nominal maka hapus, sisanya deskripsi
    function extractNominalFromLine(line) {
        let words = line.trim().split(/\s+/);
        if (words.length === 0) return null;
        let lastWord = words[words.length - 1];
        let nominal = parseNominalString(lastWord);
        if (nominal !== null) {
            // Hapus kata terakhir
            let description = words.slice(0, -1).join(' ');
            return { value: nominal, description: description, matchText: lastWord };
        }
        return null;
    }

    // Parsing teks transaksi (single atau kolektif)
    function parseTransactionText(rawText, type) {
        const lines = rawText.split(/\r?\n/).filter(l => l.trim().length > 0);
        if (lines.length === 0) throw new Error("Teks kosong");
        
        // Cek apakah baris pertama memiliki nominal (single line) atau tidak (kolektif dengan judul)
        const firstLineNominal = extractNominalFromLine(lines[0]);
        
        if (lines.length === 1 || firstLineNominal === null) {
            // Single line atau kolektif dengan judul di baris pertama
            if (lines.length === 1) {
                // Single line: harus ada nominal
                const nominalInfo = extractNominalFromLine(lines[0]);
                if (!nominalInfo) throw new Error("Tidak ditemukan nominal. Contoh: 'Buku 50.000'");
                let description = nominalInfo.description;
                if (!description) description = type === 'income' ? 'Pemasukan' : 'Pengeluaran';
                return { description, amount: nominalInfo.value, items: null, isCollective: false };
            } else {
                // Kolektif: baris pertama adalah judul (tanpa nominal)
                const title = lines[0].trim();
                if (!title) throw new Error("Judul transaksi kolektif tidak boleh kosong");
                const items = [];
                let total = 0;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    const nominalInfo = extractNominalFromLine(line);
                    if (!nominalInfo) throw new Error(`Baris "${line}" tidak memiliki nominal yang valid`);
                    let itemName = nominalInfo.description;
                    if (!itemName) itemName = `Item ${i}`;
                    items.push({ name: itemName, amount: nominalInfo.value });
                    total += nominalInfo.value;
                }
                if (items.length === 0) throw new Error("Tidak ada item dalam kolektif");
                return { description: title, amount: total, items, isCollective: true };
            }
        } else {
            // Baris pertama punya nominal, tapi ini multi baris? Maka dianggap single line gabungan
            // Gabungkan semua baris
            const combined = lines.join(' ');
            const nominalInfo = extractNominalFromLine(combined);
            if (!nominalInfo) throw new Error("Tidak ditemukan nominal");
            let description = nominalInfo.description;
            if (!description) description = type === 'income' ? 'Pemasukan' : 'Pengeluaran';
            return { description, amount: nominalInfo.value, items: null, isCollective: false };
        }
    }

    // Helper untuk menghasilkan teks representasi transaksi (untuk edit)
    function transactionToRawText(tx) {
        if (tx.items && tx.items.length > 0) {
            let result = tx.description + "\n";
            for (const item of tx.items) {
                result += `${item.name} ${item.amount}\n`;
            }
            return result.trim();
        } else {
            return `${tx.description} ${tx.amount}`;
        }
    }

    // Fungsi load accounts (sama seperti sebelumnya)
    async function loadAccounts() {
        try { const snap = await getDocs(collection(db, ACCOUNTS_COLLECTION)); const accounts = []; snap.forEach(d => accounts.push({ id: d.id, ...d.data() })); renderAccountsList(accounts); } 
        catch(e) { showToast("Gagal muat rekening: " + e.message); }
    }
    function renderAccountsList(accounts) {
        if(!accounts.length) { accountsListEl.innerHTML = '<div class="loading">✨ Belum ada rekening. + Rekening Baru</div>'; return; }
        accountsListEl.innerHTML = accounts.map(acc => `<div class="account-card" data-id="${acc.id}" data-name="${escapeHtml(acc.name)}"><span class="account-name">${escapeHtml(acc.name)}</span><span class="account-badge">🔒 6 digit</span></div>`).join('');
        document.querySelectorAll('.account-card').forEach(card => { card.addEventListener('click', () => { openLoginModal(card.dataset.id, card.dataset.name); }); });
    }
    function openLoginModal(id, name) { modalTitle.innerText = `Masuk ke ${name}`; modalInputName.style.display = 'none'; modalInputPassword.value = ''; modal.dataset.mode = 'login'; modal.dataset.id = id; modal.classList.add('active'); }
    function closeModal() { modal.classList.remove('active'); modalInputName.style.display = 'block'; modalInputName.value = ''; modalInputPassword.value = ''; modalError.innerText = ''; delete modal.dataset.mode; delete modal.dataset.id; }
    async function createNewAccount(name, pwd) { if(!name.trim()) throw new Error("Nama wajib"); if(!/^\d{6}$/.test(pwd)) throw new Error("Password 6 digit"); await addDoc(collection(db, ACCOUNTS_COLLECTION), { name: name.trim(), password: pwd, transactions: [], payers: ["Diri sendiri", "Teman", "Keluarga"] }); showToast(`Rekening "${name}" dibuat`); await loadAccounts(); }
    async function verifyAndLogin(accountId, pwd) { const docSnap = await getDoc(doc(db, ACCOUNTS_COLLECTION, accountId)); if(!docSnap.exists()) throw new Error("Rekening tidak ditemukan"); const data = docSnap.data(); if(data.password !== pwd) throw new Error("Password salah"); currentAccount = { id: accountId, ...data }; availablePayers = currentAccount.payers || ["Diri sendiri", "Teman", "Keluarga"]; updatePayerDatalists(); showDashboard(); }
    function showDashboard() { accountsView.style.display = 'none'; dashboardView.style.display = 'block'; fixedButtonsDiv.style.display = 'flex'; dashboardNama.innerText = currentAccount.name; renderFilteredTransactions(); }
    function logout() { currentAccount = null; accountsView.style.display = 'block'; dashboardView.style.display = 'none'; fixedButtonsDiv.style.display = 'none'; loadAccounts(); }
    async function updateAccountInFirebase() { if(!currentAccount) return; const ref = doc(db, ACCOUNTS_COLLECTION, currentAccount.id); await updateDoc(ref, { name: currentAccount.name, transactions: currentAccount.transactions, payers: availablePayers }); }
    async function deleteAccountWithPassword() { const pwd = prompt("Masukkan password 6 digit untuk hapus rekening:"); if(pwd !== currentAccount.password) { showToast("Password salah!"); return; } if(confirm(`Hapus rekening "${currentAccount.name}" permanen?`)) { await deleteDoc(doc(db, ACCOUNTS_COLLECTION, currentAccount.id)); showToast("Rekening dihapus"); logout(); } }
    async function editAccountName() { const pwd = prompt("Masukkan password untuk edit nama:"); if(pwd !== currentAccount.password) { showToast("Password salah"); return; } const newName = prompt("Nama baru:", currentAccount.name); if(newName && newName.trim()) { currentAccount.name = newName.trim(); await updateAccountInFirebase(); dashboardNama.innerText = currentAccount.name; showToast("Nama rekening diubah"); } }
    function updatePayerDatalists() { const options = availablePayers.map(p => `<option value="${escapeHtml(p)}">`).join(''); payerList.innerHTML = options; editPayerList.innerHTML = options; }
    async function addNewPayerFromInput(inputElement) { const newPayer = inputElement.value.trim(); if(!newPayer) { showToast("Masukkan nama pembayar"); return; } if(availablePayers.includes(newPayer)) { showToast("Pembayar sudah ada"); return; } availablePayers.push(newPayer); await updateAccountInFirebase(); updatePayerDatalists(); showToast(`Pembayar "${newPayer}" ditambahkan`); inputElement.value = newPayer; }
    
    async function openPayerManager() { renderPayerList(); payerManagerModal.classList.add('active'); }
    function renderPayerList() { if(!availablePayers.length) { payerListContainer.innerHTML = '<div class="small-text">Belum ada pembayar, tambahkan.</div>'; return; } payerListContainer.innerHTML = availablePayers.map(p => `<div class="payer-list-item"><span>👤 ${escapeHtml(p)}</span><button class="delete-payer-btn" data-payer="${escapeHtml(p)}" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🗑️</button></div>`).join(''); document.querySelectorAll('.delete-payer-btn').forEach(btn => btn.addEventListener('click', async () => { const payer = btn.dataset.payer; if(confirm(`Hapus pembayar "${payer}"?`)) { availablePayers = availablePayers.filter(p => p !== payer); currentAccount.transactions.forEach(tx => { if(tx.payer === payer) tx.payer = ""; }); await updateAccountInFirebase(); updatePayerDatalists(); renderFilteredTransactions(); renderPayerList(); showToast("Pembayar dihapus"); } })); }
    async function addNewPayerGlobal() { const newPayer = newPayerName.value.trim(); if(!newPayer) return; if(availablePayers.includes(newPayer)) { showToast("Sudah ada"); return; } availablePayers.push(newPayer); await updateAccountInFirebase(); updatePayerDatalists(); renderFilteredTransactions(); renderPayerList(); newPayerName.value = ''; showToast("Pembayar ditambahkan"); }
    
    function openAddTransactionModal(type) {
        pendingTransactionType = type;
        transaksiModalTitle.innerText = type === 'income' ? '➕ Tambah Pemasukan' : '➖ Tambah Pengeluaran';
        txRawText.value = '';
        txPayer.value = '';
        txDate.value = new Date().toISOString().split('T')[0];
        transaksiModal.classList.add('active');
    }
    async function saveNewTransaction() {
        const rawText = txRawText.value.trim();
        if(!rawText) { showToast("Masukkan deskripsi dan nominal"); return; }
        let parsed;
        try { parsed = parseTransactionText(rawText, pendingTransactionType); } catch(e) { showToast(e.message); return; }
        const payer = txPayer.value.trim();
        let date = txDate.value;
        if(!date) date = new Date().toISOString().split('T')[0];
        if(payer && !availablePayers.includes(payer)) { availablePayers.push(payer); await updateAccountInFirebase(); updatePayerDatalists(); }
        const newTx = { 
            id: Date.now().toString() + Math.random().toString(36).substr(2, 5), 
            description: parsed.description, 
            amount: parsed.amount, 
            type: pendingTransactionType, 
            payer: payer || "", 
            date: new Date(date).toISOString(),
            items: parsed.items || null,
            isCollective: parsed.isCollective || false
        };
        currentAccount.transactions = [newTx, ...(currentAccount.transactions || [])];
        await updateAccountInFirebase();
        renderFilteredTransactions();
        transaksiModal.classList.remove('active');
        showToast(`Transaksi ${pendingTransactionType === 'income' ? 'pemasukan' : 'pengeluaran'} ditambahkan (Rp ${parsed.amount.toLocaleString()})`);
    }
    
    async function renderFilteredTransactions() {
        if(!currentAccount) return;
        let filtered = [...(currentAccount.transactions || [])];
        const start = filterStart.value, end = filterEnd.value;
        if(start) filtered = filtered.filter(t => new Date(t.date) >= new Date(start));
        if(end) filtered = filtered.filter(t => new Date(t.date) <= new Date(end + "T23:59:59"));
        const field = sortField.value, order = sortOrder.value;
        filtered.sort((a,b) => { let valA, valB; if(field === 'date') { valA = new Date(a.date); valB = new Date(b.date); } else if(field === 'description') { valA = a.description.toLowerCase(); valB = b.description.toLowerCase(); } else if(field === 'payer') { valA = (a.payer || '').toLowerCase(); valB = (b.payer || '').toLowerCase(); } else { valA = a.amount; valB = b.amount; } if(order === 'asc') return valA > valB ? 1 : -1; else return valA < valB ? 1 : -1; });
        let saldo = 0; (currentAccount.transactions || []).forEach(tx => { if(tx.type === 'income') saldo += tx.amount; else saldo -= tx.amount; });
        dashboardSaldo.innerText = formatRupiah(saldo);
        if(!filtered.length) { transactionsListEl.innerHTML = '<div class="empty-trans">Tidak ada transaksi</div>'; return; }
        transactionsListEl.innerHTML = filtered.map(tx => `
            <div class="transaksi-item" data-id="${tx.id}">
                <div class="transaksi-detail">
                    <div class="transaksi-deskripsi">
                        ${escapeHtml(tx.description)}${tx.isCollective ? '<span class="collective-badge">📋 Kolektif</span>' : ''}
                        ${tx.payer ? `<span class="payer-badge">👤 ${escapeHtml(tx.payer)}</span>` : ''}
                        <div class="transaksi-tanggal">${formatDate(tx.date)}</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="transaksi-nominal ${tx.type === 'income' ? 'income' : 'expense'}">
                        ${tx.type === 'income' ? '+' : '-'} ${formatRupiah(tx.amount)}
                    </span>
                    <div class="action-buttons">
                        <button class="edit-trans" data-id="${tx.id}">✏️</button>
                        <button class="delete-trans" data-id="${tx.id}">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.transaksi-item').forEach(el => {
            const id = el.dataset.id;
            el.addEventListener('click', (e) => {
                if(e.target.classList.contains('edit-trans') || e.target.classList.contains('delete-trans')) return;
                const tx = currentAccount.transactions.find(t => t.id === id);
                if(tx && tx.isCollective && tx.items) showDetailModal(tx);
                else if(tx && !tx.isCollective) showToast("Transaksi biasa, tidak memiliki rincian");
            });
        });
        document.querySelectorAll('.delete-trans').forEach(btn => btn.addEventListener('click', async (e) => { e.stopPropagation(); const id = btn.dataset.id; if(confirm("Hapus transaksi?")) { currentAccount.transactions = currentAccount.transactions.filter(t => t.id !== id); await updateAccountInFirebase(); renderFilteredTransactions(); showToast("Dihapus"); } }));
        document.querySelectorAll('.edit-trans').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = btn.dataset.id; const tx = currentAccount.transactions.find(t => t.id === id); if(tx) openEditModal(tx); }));
    }
    function showDetailModal(tx) {
        detailTitle.innerText = `Detail: ${tx.description}`;
        let html = `<div style="margin-bottom:12px;"><strong>Total:</strong> ${formatRupiah(tx.amount)}</div>`;
        html += `<div style="margin-top:8px;"><strong>Rincian:</strong></div>`;
        for (const item of tx.items) {
            html += `<div class="detail-item"><span>${escapeHtml(item.name)}</span><span>${formatRupiah(item.amount)}</span></div>`;
        }
        detailContent.innerHTML = html;
        detailModal.classList.add('active');
    }
    closeDetailBtn.addEventListener('click', () => detailModal.classList.remove('active'));
    
    function openEditModal(tx) {
        currentEditTransactionId = tx.id;
        const rawText = transactionToRawText(tx);
        editRawText.value = rawText;
        editPayer.value = tx.payer || "";
        editDate.value = tx.date ? tx.date.split('T')[0] : new Date().toISOString().split('T')[0];
        editTransModal.classList.add('active');
    }
    async function saveEditedTransaction() {
        const rawText = editRawText.value.trim();
        if(!rawText) { showToast("Masukkan teks transaksi"); return; }
        let parsed;
        try { parsed = parseTransactionText(rawText, currentAccount.transactions.find(t => t.id === currentEditTransactionId).type); } catch(e) { showToast(e.message); return; }
        let newPayer = editPayer.value.trim();
        const newDate = editDate.value;
        if(newPayer && !availablePayers.includes(newPayer)) { availablePayers.push(newPayer); await updateAccountInFirebase(); updatePayerDatalists(); }
        const index = currentAccount.transactions.findIndex(t => t.id === currentEditTransactionId);
        if(index !== -1) {
            currentAccount.transactions[index] = { 
                ...currentAccount.transactions[index], 
                description: parsed.description, 
                amount: parsed.amount, 
                payer: newPayer || "", 
                date: new Date(newDate).toISOString(),
                items: parsed.items || null,
                isCollective: parsed.isCollective || false
            };
            await updateAccountInFirebase();
            renderFilteredTransactions();
            showToast("Transaksi diupdate");
        }
        editTransModal.classList.remove('active');
    }
    function resetFilters() { filterStart.value = ''; filterEnd.value = ''; sortField.value = 'date'; sortOrder.value = 'desc'; renderFilteredTransactions(); }

    // Event listeners
    btnTambahRekening.addEventListener('click', () => { modalTitle.innerText = "Rekening Baru"; modalInputName.style.display = 'block'; modalInputPassword.value = ''; modalInputName.value = ''; modal.dataset.mode = 'create'; modal.classList.add('active'); });
    modalCancelBtn.addEventListener('click', closeModal);
    modalConfirmBtn.addEventListener('click', async () => { if(modal.dataset.mode === 'create') { try { await createNewAccount(modalInputName.value.trim(), modalInputPassword.value.trim()); closeModal(); } catch(e) { modalError.innerText = e.message; } } else if(modal.dataset.mode === 'login') { try { await verifyAndLogin(modal.dataset.id, modalInputPassword.value.trim()); closeModal(); } catch(e) { modalError.innerText = e.message; } } });
    logoutButton.addEventListener('click', logout); editAccountBtn.addEventListener('click', editAccountName); deleteAccountBtn.addEventListener('click', deleteAccountWithPassword);
    btnIncomeFloating.addEventListener('click', () => openAddTransactionModal('income')); btnExpenseFloating.addEventListener('click', () => openAddTransactionModal('expense'));
    txModalCancel.addEventListener('click', () => transaksiModal.classList.remove('active')); txModalSave.addEventListener('click', saveNewTransaction);
    editTransCancel.addEventListener('click', () => editTransModal.classList.remove('active')); editTransSave.addEventListener('click', saveEditedTransaction);
    resetFilterBtn.addEventListener('click', resetFilters); filterStart.addEventListener('change', renderFilteredTransactions); filterEnd.addEventListener('change', renderFilteredTransactions); sortField.addEventListener('change', renderFilteredTransactions); sortOrder.addEventListener('change', renderFilteredTransactions);
    btnAddNewPayer.addEventListener('click', () => addNewPayerFromInput(txPayer)); btnEditAddNewPayer.addEventListener('click', () => addNewPayerFromInput(editPayer));
    managePayerBtn.addEventListener('click', openPayerManager); addNewPayerBtn.addEventListener('click', addNewPayerGlobal); closePayerManager.addEventListener('click', () => payerManagerModal.classList.remove('active'));
    window.addEventListener('DOMContentLoaded', () => { loadAccounts(); });
</script>
</body>
</html>
