    <!-- Firebase SDK (modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, getDoc, addDoc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMvdKLVmlEQVITyd49jp0gB_jF3rIjaZY",
            authDomain: "dompet-b4b18.firebaseapp.com",
            projectId: "dompet-b4b18",
            storageBucket: "dompet-b4b18.firebasestorage.app",
            messagingSenderId: "147680807243",

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ACCOUNTS_COLLECTION = "accounts";

        window.db = db;
        window.ACCOUNTS_COLLECTION = ACCOUNTS_COLLECTION;

        window.doc = doc;
        window.setDoc = setDoc;

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fb;
            padding: 16px;
            padding-bottom: 32px;
            color: #1e293b;
        }
        .app-container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #0f2b3d, #1e4a6b); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .btn-icon {
            background: white; border: none; padding: 10px 16px; border-radius: 48px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s;
            color: #1e4a6b; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .btn-icon:active { transform: scale(0.96); background: #f1f5f9; }
        .btn-primary { background: #1e4a6b; color: white; border: none; }
        .btn-danger { background: #fff1f0; color: #c2410c; border-color: #ffddd6; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
        .accounts-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .account-card {
            background: white; border-radius: 28px; padding: 20px; display: flex;
            justify-content: space-between; align-items: center; cursor: pointer;
            border: 1px solid #edf2f7; transition: 0.2s;
        }
        .account-card:active { background: #fafcff; transform: scale(0.99); }
        .account-name { font-size: 1.25rem; font-weight: 600; }
        .account-badge { background: #eef2ff; padding: 6px 12px; border-radius: 40px; font-size: 0.75rem; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; width: 90%; max-width: 360px; border-radius: 40px;
            padding: 28px 24px; max-height: 85vh; overflow-y: auto;
        }
        .modal-card h3 { font-size: 1.5rem; margin-bottom: 20px; }
        .modal-card input, .modal-card select {
            width: 100%; padding: 12px 16px; margin: 8px 0 16px;
            border: 1.5px solid #e2e8f0; border-radius: 60px; font-size: 1rem;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 16px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 60px; font-weight: 600; border: none; cursor: pointer; }
        .dashboard-view { display: none; }
        .dashboard-view.active { display: block; }
        .dashboard-header { background: white; border-radius: 32px; padding: 20px; margin-bottom: 16px; }
        .saldo { font-size: 2.2rem; font-weight: 800; margin: 8px 0; color: #0f3a55; }
        .rekening-title { font-size: 1.2rem; font-weight: 500; color: #475569; }
        .form-transaksi { background: white; border-radius: 32px; padding: 20px; margin-bottom: 16px; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-row input, .form-row select { flex: 1; padding: 12px 16px; border-radius: 48px; border: 1.5px solid #e2e8f0; }
        .radio-group { display: flex; gap: 20px; align-items: center; background: #f8fafc; padding: 6px 16px; border-radius: 60px; }
        .filter-bar {
            background: white; border-radius: 32px; padding: 16px; margin-bottom: 16px;
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        }
        .filter-bar input, .filter-bar select { padding: 10px 12px; border-radius: 60px; border: 1px solid #e2e8f0; flex: 1; min-width: 120px; }
        .transaksi-list { background: white; border-radius: 32px; padding: 8px 4px; max-height: 460px; overflow-y: auto; }
        .transaksi-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 12px; border-bottom: 1px solid #f0f2f5;
        }
        .transaksi-detail { flex: 1; }
        .transaksi-deskripsi { font-weight: 500; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .tag-badge { background: #e2e8f0; padding: 2px 10px; border-radius: 30px; font-size: 0.7rem; font-weight: 500; color: #1f2937; }
        .transaksi-tanggal { font-size: 0.7rem; color: #94a3b8; }
        .transaksi-nominal { font-weight: 700; font-size: 1rem; }
        .income { color: #15803d; }
        .expense { color: #b91c1c; }
        .action-buttons { display: flex; gap: 6px; align-items: center; }
        .edit-trans, .delete-trans { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 6px; border-radius: 30px; }
        .edit-trans:active, .delete-trans:active { background: #eef2ff; }
        .toast-message { position: fixed; bottom: 30px; left: 20px; right: 20px; background: #1f2937; color: white; text-align: center; padding: 12px; border-radius: 60px; z-index: 1100; opacity: 0; transition: 0.3s; pointer-events: none; }
        .tag-manager { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
        .tag-item { background: #eef2ff; padding: 6px 14px; border-radius: 40px; display: flex; align-items: center; gap: 8px; }
        .tag-item button { background: none; border: none; font-size: 1rem; cursor: pointer; color: #475569; }
        hr { margin: 12px 0; }
        .small-text { font-size: 0.75rem; color: #64748b; }
    </style>
</head>
<body>
<div class="app-container">
    <div id="accountsView">
        <div class="header"><h1>Dompet NBS</h1><button class="btn-icon" id="btnTambahRekening">+ Rekening</button></div>
        <div id="accountsList" class="accounts-grid"><div class="loading">Memuat rekening...</div></div>
    </div>
    <div id="dashboardView" class="dashboard-view">
        <div class="dashboard-header">
            <div class="rekening-title" id="dashboardNamaRekening">-</div>
            <div class="saldo" id="dashboardSaldo">Rp0</div>
            <div style="display: flex; gap: 12px; margin-top: 12px;">
                <button class="btn-icon btn-outline" id="logoutButton">← Daftar Rekening</button>
                <button class="btn-icon btn-outline" id="editAccountBtn">✏️ Edit Rekening</button>
                <button class="btn-icon btn-danger" id="deleteAccountBtn">🗑️ Hapus</button>
            </div>
        </div>
        <div class="form-transaksi">
            <div class="form-row"><input type="text" id="descTransaksi" placeholder="Deskripsi"></div>
            <div class="form-row">
                <input type="number" id="jumlahTransaksi" placeholder="Nominal" step="1000">
                <select id="tagSelect"><option value="">Pilih Tag</option></select>
                <button class="btn-icon" id="manageTagBtn" style="padding: 0 12px;">🏷️ Kelola</button>
            </div>
            <div class="form-row">
                <input type="date" id="tanggalTransaksi">
                <div class="radio-group">
                    <label><input type="radio" name="jenisTransaksi" value="income" checked> + Pemasukan</label>
                    <label><input type="radio" name="jenisTransaksi" value="expense"> - Pengeluaran</label>
                </div>
            </div>
            <button id="btnTambahTransaksi" class="btn-icon btn-primary" style="width:100%; justify-content:center;">+ Tambah Catatan</button>
        </div>
        <div class="filter-bar">
            <input type="date" id="filterStartDate" placeholder="Dari tanggal">
            <input type="date" id="filterEndDate" placeholder="Sampai tanggal">
            <select id="filterTagSelect"><option value="">Semua Tag</option></select>
            <select id="sortSelect">
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
                <option value="highest">Nominal Tertinggi</option>
                <option value="lowest">Nominal Terendah</option>
            </select>
            <button id="resetFilterBtn" class="btn-icon" style="padding: 8px 12px;">Reset</button>
        </div>
        <h3 style="margin: 8px 0 8px 6px;">📋 Riwayat</h3>
        <div id="transactionsList" class="transaksi-list"><div class="empty-trans">Belum ada transaksi</div></div>
    </div>
</div>
<div id="modalOverlay" class="modal-overlay"><div class="modal-card"><h3 id="modalTitle">Rekening Baru</h3><input type="text" id="modalInputName" placeholder="Nama rekening"><input type="password" id="modalInputPassword" inputmode="numeric" maxlength="6" placeholder="Password 6 digit"><div id="modalError" style="color:#c2410c;"></div><div class="modal-buttons"><button id="modalCancelBtn">Batal</button><button id="modalConfirmBtn" class="btn-primary">Simpan</button></div></div></div>
<div id="editTransModal" class="modal-overlay"><div class="modal-card"><h3>Edit Transaksi</h3><input type="text" id="editDesc" placeholder="Deskripsi"><input type="number" id="editAmount" placeholder="Nominal"><select id="editTagSelect"></select><input type="date" id="editDate"><div class="radio-group"><label><input type="radio" name="editType" value="income"> + Pemasukan</label><label><input type="radio" name="editType" value="expense"> - Pengeluaran</label></div><div class="modal-buttons"><button id="editTransCancel">Batal</button><button id="editTransSave" class="btn-primary">Simpan</button></div></div></div>
<div id="tagManagerModal" class="modal-overlay"><div class="modal-card"><h3>Kelola Tag</h3><div id="tagListContainer" class="tag-manager"></div><div class="form-row"><input type="text" id="newTagName" placeholder="Nama tag baru"><button id="addTagBtn" class="btn-icon">+ Tambah</button></div><div class="modal-buttons"><button id="closeTagManager">Tutup</button></div></div></div>
<div id="toastMsg" class="toast-message"></div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, doc, getDocs, getDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    const firebaseConfig = { apiKey: "AIzaSyBMvdKLVmlEQVITyd49jp0gB_jF3rIjaZY", authDomain: "dompet-b4b18.firebaseapp.com", projectId: "dompet-b4b18", storageBucket: "dompet-b4b18.firebasestorage.app", messagingSenderId: "147680807243", appId: "1:147680807243:web:8ebab5a7adf1ff82e100ce" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ACCOUNTS_COLLECTION = "accounts";
    let currentAccount = null;
    let allTransactions = [];
    let availableTags = [];
    let currentEditTransactionId = null;

    // DOM elements
    const accountsViewDiv = document.getElementById('accountsView'), dashboardDiv = document.getElementById('dashboardView');
    const accountsListEl = document.getElementById('accountsList'), modal = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle'), modalInputName = document.getElementById('modalInputName'), modalInputPassword = document.getElementById('modalInputPassword'), modalError = document.getElementById('modalError');
    const btnTambahRekening = document.getElementById('btnTambahRekening'), modalCancelBtn = document.getElementById('modalCancelBtn'), modalConfirmBtn = document.getElementById('modalConfirmBtn');
    const logoutButton = document.getElementById('logoutButton'), editAccountBtn = document.getElementById('editAccountBtn'), deleteAccountBtn = document.getElementById('deleteAccountBtn');
    const btnTambahTransaksi = document.getElementById('btnTambahTransaksi'), descTransaksi = document.getElementById('descTransaksi'), jumlahTransaksi = document.getElementById('jumlahTransaksi'), tagSelect = document.getElementById('tagSelect'), tanggalTransaksi = document.getElementById('tanggalTransaksi');
    const dashboardNamaRekening = document.getElementById('dashboardNamaRekening'), dashboardSaldo = document.getElementById('dashboardSaldo'), transactionsListEl = document.getElementById('transactionsList');
    const filterStart = document.getElementById('filterStartDate'), filterEnd = document.getElementById('filterEndDate'), filterTag = document.getElementById('filterTagSelect'), sortSelect = document.getElementById('sortSelect'), resetFilterBtn = document.getElementById('resetFilterBtn');
    const editTransModal = document.getElementById('editTransModal'), editDesc = document.getElementById('editDesc'), editAmount = document.getElementById('editAmount'), editTagSelect = document.getElementById('editTagSelect'), editDate = document.getElementById('editDate'), editTransCancel = document.getElementById('editTransCancel'), editTransSave = document.getElementById('editTransSave');
    const tagManagerModal = document.getElementById('tagManagerModal'), tagListContainer = document.getElementById('tagListContainer'), newTagName = document.getElementById('newTagName'), addTagBtn = document.getElementById('addTagBtn'), closeTagManager = document.getElementById('closeTagManager');
    const manageTagBtn = document.getElementById('manageTagBtn');

    function showToast(msg) { const toast = document.getElementById('toastMsg'); toast.textContent = msg; toast.style.opacity = '1'; setTimeout(() => toast.style.opacity = '0', 2000); }
    function formatRupiah(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); }
    function formatDate(iso) { if(!iso) return "-"; const d = new Date(iso); return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }); }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    async function loadAccounts() { try { const snap = await getDocs(collection(db, ACCOUNTS_COLLECTION)); const accounts = []; snap.forEach(d => accounts.push({ id: d.id, ...d.data() })); renderAccountsList(accounts); } catch(e) { showToast("Gagal muat rekening"); } }
    function renderAccountsList(accounts) { if(!accounts.length) { accountsListEl.innerHTML = '<div class="loading">✨ Belum ada rekening. + Rekening Baru</div>'; return; } accountsListEl.innerHTML = accounts.map(acc => `<div class="account-card" data-id="${acc.id}" data-name="${escapeHtml(acc.name)}"><span class="account-name">${escapeHtml(acc.name)}</span><span class="account-badge">🔒 6 digit</span></div>`).join(''); document.querySelectorAll('.account-card').forEach(card => { card.addEventListener('click', () => { const id = card.dataset.id, name = card.dataset.name; openLoginModal(id, name); }); }); }
    function openLoginModal(accountId, accountName) { modalTitle.innerText = `Masuk ke ${accountName}`; modalInputName.style.display = 'none'; modalInputPassword.value = ''; modalError.innerText = ''; modal.dataset.mode = 'login'; modal.dataset.id = accountId; modal.classList.add('active'); }
    function closeModal() { modal.classList.remove('active'); modalInputName.style.display = 'block'; modalInputName.value = ''; modalInputPassword.value = ''; modalError.innerText = ''; delete modal.dataset.mode; delete modal.dataset.id; }
    async function createNewAccount(name, password) { if(!name.trim()) throw new Error("Nama wajib"); if(!/^\d{6}$/.test(password)) throw new Error("Password 6 digit angka"); await addDoc(collection(db, ACCOUNTS_COLLECTION), { name: name.trim(), password, transactions: [], tags: ["Makanan", "Transport", "Belanja", "Tagihan"] }); showToast(`Rekening "${name}" dibuat`); await loadAccounts(); }
    async function verifyAndLogin(accountId, pwd) { const docSnap = await getDoc(doc(db, ACCOUNTS_COLLECTION, accountId)); if(!docSnap.exists()) throw new Error("Tidak ditemukan"); const data = docSnap.data(); if(data.password !== pwd) throw new Error("Password salah"); currentAccount = { id: accountId, ...data }; availableTags = currentAccount.tags || ["Makanan", "Transport", "Belanja", "Tagihan"]; allTransactions = currentAccount.transactions || []; updateTagSelects(); showDashboard(); }
    function showDashboard() { accountsViewDiv.style.display = 'none'; dashboardDiv.classList.add('active'); dashboardNamaRekening.innerText = currentAccount.name; renderFilteredTransactions(); }
    function logout() { currentAccount = null; accountsViewDiv.style.display = 'block'; dashboardDiv.classList.remove('active'); loadAccounts(); }
    async function updateAccountInFirebase() { if(!currentAccount) return; const ref = doc(db, ACCOUNTS_COLLECTION, currentAccount.id); await updateDoc(ref, { name: currentAccount.name, transactions: currentAccount.transactions, tags: availableTags }); }
    async function deleteAccountWithPassword() { const pwd = prompt("Masukkan password 6 digit untuk menghapus rekening:"); if(pwd !== currentAccount.password) { showToast("Password salah!"); return; } if(confirm(`Hapus rekening "${currentAccount.name}" secara permanen?`)) { await deleteDoc(doc(db, ACCOUNTS_COLLECTION, currentAccount.id)); showToast("Rekening dihapus"); logout(); } }
    async function editAccountName() { const pwd = prompt("Masukkan password 6 digit untuk mengedit nama:"); if(pwd !== currentAccount.password) { showToast("Password salah!"); return; } const newName = prompt("Nama baru:", currentAccount.name); if(newName && newName.trim()) { currentAccount.name = newName.trim(); await updateAccountInFirebase(); dashboardNamaRekening.innerText = currentAccount.name; showToast("Nama rekening diubah"); } }
    function updateTagSelects() { const options = '<option value="">Tanpa Tag</option>' + availableTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join(''); tagSelect.innerHTML = options; filterTag.innerHTML = '<option value="">Semua Tag</option>' + availableTags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join(''); editTagSelect.innerHTML = options; }
    async function openTagManager() { renderTagList(); tagManagerModal.classList.add('active'); }
    function renderTagList() { if(!availableTags.length) { tagListContainer.innerHTML = '<div class="small-text">Belum ada tag, tambahkan.</div>'; return; } tagListContainer.innerHTML = availableTags.map((tag, idx) => `<div class="tag-item">${escapeHtml(tag)} <button class="edit-tag-btn" data-tag="${escapeHtml(tag)}">✏️</button> <button class="delete-tag-btn" data-tag="${escapeHtml(tag)}">🗑️</button></div>`).join(''); document.querySelectorAll('.edit-tag-btn').forEach(btn => btn.addEventListener('click', async () => { const oldTag = btn.dataset.tag; const newTag = prompt("Edit tag:", oldTag); if(newTag && newTag.trim() && newTag !== oldTag) { const index = availableTags.indexOf(oldTag); if(index !== -1) { availableTags[index] = newTag.trim(); currentAccount.transactions.forEach(tx => { if(tx.tag === oldTag) tx.tag = newTag.trim(); }); await updateAccountInFirebase(); updateTagSelects(); renderFilteredTransactions(); renderTagList(); showToast("Tag diupdate"); } } })); document.querySelectorAll('.delete-tag-btn').forEach(btn => btn.addEventListener('click', async () => { const tag = btn.dataset.tag; if(confirm(`Hapus tag "${tag}"? Transaksi dengan tag ini akan menjadi tanpa tag.`)) { availableTags = availableFilters.filter(t => t !== tag); currentAccount.transactions.forEach(tx => { if(tx.tag === tag) tx.tag = ""; }); await updateAccountInFirebase(); updateTagSelects(); renderFilteredTransactions(); renderTagList(); showToast("Tag dihapus"); } })); }
    async function addNewTag() { const newTag = newTagName.value.trim(); if(!newTag) return; if(availableTags.includes(newTag)) { showToast("Tag sudah ada"); return; } availableTags.push(newTag); await updateAccountInFirebase(); updateTagSelects(); renderFilteredTransactions(); renderTagList(); newTagName.value = ''; showToast("Tag ditambahkan"); }
    async function addTransaction() { const desc = descTransaksi.value.trim(); let amount = parseFloat(jumlahTransaksi.value); const type = document.querySelector('input[name="jenisTransaksi"]:checked').value; const tag = tagSelect.value; let date = tanggalTransaksi.value; if(!desc) { showToast("Deskripsi wajib"); return; } if(isNaN(amount) || amount <= 0) { showToast("Nominal > 0"); return; } if(!date) date = new Date().toISOString().split('T')[0]; const newTx = { id: Date.now().toString() + Math.random().toString(36).substr(2, 5), description: desc, amount: Math.abs(amount), type, tag: tag || "", date: new Date(date).toISOString() }; currentAccount.transactions = [newTx, ...(currentAccount.transactions || [])]; await updateAccountInFirebase(); allTransactions = currentAccount.transactions; descTransaksi.value = ''; jumlahTransaksi.value = ''; tanggalTransaksi.value = ''; renderFilteredTransactions(); showToast("Transaksi ditambahkan"); }
    function renderFilteredTransactions() { if(!currentAccount) return; let filtered = [...(currentAccount.transactions || [])]; const start = filterStart.value, end = filterEnd.value; if(start) filtered = filtered.filter(t => new Date(t.date) >= new Date(start)); if(end) filtered = filtered.filter(t => new Date(t.date) <= new Date(end + "T23:59:59")); const selectedTag = filterTag.value; if(selectedTag) filtered = filtered.filter(t => t.tag === selectedTag); const sortBy = sortSelect.value; if(sortBy === 'newest') filtered.sort((a,b) => new Date(b.date) - new Date(a.date)); else if(sortBy === 'oldest') filtered.sort((a,b) => new Date(a.date) - new Date(b.date)); else if(sortBy === 'highest') filtered.sort((a,b) => b.amount - a.amount); else if(sortBy === 'lowest') filtered.sort((a,b) => a.amount - b.amount); let saldo = 0; (currentAccount.transactions || []).forEach(tx => { if(tx.type === 'income') saldo += tx.amount; else saldo -= tx.amount; }); dashboardSaldo.innerText = formatRupiah(saldo); if(!filtered.length) { transactionsListEl.innerHTML = '<div class="empty-trans">Tidak ada transaksi sesuai filter</div>'; return; } transactionsListEl.innerHTML = filtered.map(tx => `<div class="transaksi-item" data-id="${tx.id}"><div class="transaksi-detail"><div class="transaksi-deskripsi">${escapeHtml(tx.description)} ${tx.tag ? `<span class="tag-badge">${escapeHtml(tx.tag)}</span>` : ''}<div class="transaksi-tanggal">${formatDate(tx.date)}</div></div></div><div style="display:flex; align-items:center; gap:8px;"><span class="transaksi-nominal ${tx.type === 'income' ? 'income' : 'expense'}">${tx.type === 'income' ? '+' : '-'} ${formatRupiah(tx.amount)}</span><div class="action-buttons"><button class="edit-trans" data-id="${tx.id}">✏️</button><button class="delete-trans" data-id="${tx.id}">🗑️</button></div></div></div>`).join(''); document.querySelectorAll('.delete-trans').forEach(btn => btn.addEventListener('click', async (e) => { e.stopPropagation(); const id = btn.dataset.id; if(confirm("Hapus transaksi?")) { currentAccount.transactions = currentAccount.transactions.filter(t => t.id !== id); await updateAccountInFirebase(); allTransactions = currentAccount.transactions; renderFilteredTransactions(); showToast("Dihapus"); } })); document.querySelectorAll('.edit-trans').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = btn.dataset.id; const tx = currentAccount.transactions.find(t => t.id === id); if(tx) openEditModal(tx); })); }
    function openEditModal(tx) { currentEditTransactionId = tx.id; editDesc.value = tx.description; editAmount.value = tx.amount; editTagSelect.value = tx.tag || ""; editDate.value = tx.date ? tx.date.split('T')[0] : new Date().toISOString().split('T')[0]; document.querySelector(`input[name="editType"][value="${tx.type}"]`).checked = true; editTransModal.classList.add('active'); }
    async function saveEditedTransaction() { const newDesc = editDesc.value.trim(); const newAmount = parseFloat(editAmount.value); const newType = document.querySelector('input[name="editType"]:checked').value; const newTag = editTagSelect.value; const newDate = editDate.value; if(!newDesc || isNaN(newAmount) || newAmount <= 0) { showToast("Data tidak valid"); return; } const index = currentAccount.transactions.findIndex(t => t.id === currentEditTransactionId); if(index !== -1) { currentAccount.transactions[index] = { ...currentAccount.transactions[index], description: newDesc, amount: Math.abs(newAmount), type: newType, tag: newTag || "", date: new Date(newDate).toISOString() }; await updateAccountInFirebase(); allTransactions = currentAccount.transactions; renderFilteredTransactions(); showToast("Transaksi diupdate"); } editTransModal.classList.remove('active'); }
    function resetFilters() { filterStart.value = ''; filterEnd.value = ''; filterTag.value = ''; sortSelect.value = 'newest'; renderFilteredTransactions(); }

    btnTambahRekening.addEventListener('click', () => { modalTitle.innerText = "Rekening Baru"; modalInputName.style.display = 'block'; modalInputPassword.value = ''; modalInputName.value = ''; modalError.innerText = ''; modal.dataset.mode = 'create'; modal.classList.add('active'); });
    modalCancelBtn.addEventListener('click', closeModal);
    modalConfirmBtn.addEventListener('click', async () => { if(modal.dataset.mode === 'create') { try { await createNewAccount(modalInputName.value.trim(), modalInputPassword.value.trim()); closeModal(); } catch(e) { modalError.innerText = e.message; } } else if(modal.dataset.mode === 'login') { try { await verifyAndLogin(modal.dataset.id, modalInputPassword.value.trim()); closeModal(); } catch(e) { modalError.innerText = e.message; } } });
    logoutButton.addEventListener('click', logout); editAccountBtn.addEventListener('click', editAccountName); deleteAccountBtn.addEventListener('click', deleteAccountWithPassword);
    btnTambahTransaksi.addEventListener('click', addTransaction); manageTagBtn.addEventListener('click', openTagManager); addTagBtn.addEventListener('click', addNewTag); closeTagManager.addEventListener('click', () => tagManagerModal.classList.remove('active'));
    editTransCancel.addEventListener('click', () => editTransModal.classList.remove('active')); editTransSave.addEventListener('click', saveEditedTransaction);
    resetFilterBtn.addEventListener('click', resetFilters); filterStart.addEventListener('change', renderFilteredTransactions); filterEnd.addEventListener('change', renderFilteredTransactions); filterTag.addEventListener('change', renderFilteredTransactions); sortSelect.addEventListener('change', renderFilteredTransactions);
    window.addEventListener('DOMContentLoaded', () => { loadAccounts(); tanggalTransaksi.value = new Date().toISOString().split('T')[0]; });
